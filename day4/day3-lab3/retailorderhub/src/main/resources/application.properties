spring.application.name=retailorderhub

# In-memory H2 database - fine for training purposes.
spring.datasource.url=jdbc:h2:mem:retailorderhub
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Lab 3 (Day 3): Circuit Breaker for the payment gateway.
# Small window / short wait so state transitions are visible within minutes -
# see the lab's Reflection section for production-sizing guidance.

management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents

# Look at the last 4 calls to calculate the failure rate
resilience4j.circuitbreaker.instances.paymentGateway.sliding-window-size=4

# Open the circuit if 50% or more calls fail
resilience4j.circuitbreaker.instances.paymentGateway.failure-rate-threshold=50

# Keep the circuit OPEN for 10 seconds before testing again
resilience4j.circuitbreaker.instances.paymentGateway.wait-duration-in-open-state=10s

# When HALF_OPEN, allow 2 test calls to check if the service recovered
resilience4j.circuitbreaker.instances.paymentGateway.permitted-number-of-calls-in-half-open-state=2

# Automatically move from OPEN to HALF_OPEN after the wait period
resilience4j.circuitbreaker.instances.paymentGateway.automatic-transition-from-open-to-half-open-enabled=true
