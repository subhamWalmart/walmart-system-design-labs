spring.application.name=order-service
server.port=8081

# Database-per-Service: this in-memory H2 instance belongs to order-service
# alone. inventory-service and payment-service cannot see this database, and
# order-service cannot see theirs.
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# No data.sql here - orders start empty, unlike inventory's seeded catalog.

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Fail fast with a clear error instead of hanging if inventory-service or
# payment-service can't be reached (e.g. not started yet, or not yet
# registered with Eureka).
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000
