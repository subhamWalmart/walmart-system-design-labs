spring.application.name=payment-service
server.port=8083

# No datasource here on purpose - PaymentService is stateless (it performs a
# charge, it doesn't record one), so this is the one service in the whole
# project without a database of its own.

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
